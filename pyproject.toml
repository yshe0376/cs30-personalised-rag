[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cs30-personalised-rag"
version = "0.1.0"
description = "CS-30 personalised AI learning assistant capstone project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12,<3",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

ml = [
    "faiss-cpu>=1.8,<2",
    "sentence-transformers>=3,<6",
]
[project.scripts]
cs30-demo = "cs30.pipeline:main"
cs30-task7-demo = "cs30.generation.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cs30" = ["configs/*.toml"]
"cs30.fixtures" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
