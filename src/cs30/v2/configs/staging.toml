environment = "staging"
fixture_mode = false

[corpus]
mode = "official"
corpus_mode = "official"
corpus_version = "2.0.0-rc.1"
required_textbook_ids = [
  "openstax_college_physics_2e",
  "openstax_physics",
  "openstax_college_physics_ap_2e",
]
output_dir = "artifacts/v2/textbooks/2.0.0-rc.1"
# The frozen chunk ruler; changing it re-chunks the corpus and changes every
# chunk ID, so it is a contract change, not a tuning knob. It is chosen
# separately from embedding_model below.
chunk_config = { tokenizer_name = "google-bert/bert-base-uncased", tokenizer_revision = "86b5e0934494bd15c9632b12f734a8a67f723594" }
sources_dir = "data/raw/v2"
embedding_model = "Alibaba-NLP/gte-modernbert-base"
embedding_max_seq_length = 8192
index_batch_size = 32

[concept_check]
enabled = false
allow_llm_generation = false
allow_unreviewed_questions = false
promotion_threshold = 0.75
demotion_threshold = 0.25
level_change_window = 3
attempt_coverage_window = 5
correct_difficulty_weights = [0.5, 1.0, 1.0]
wrong_difficulty_weights = [1.0, 1.0, 0.5]
min_topic_support = 0.5
