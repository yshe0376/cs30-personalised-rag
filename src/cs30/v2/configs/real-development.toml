environment = "development"
fixture_mode = false

[corpus]
mode = "development"
corpus_mode = "development"
corpus_version = "2.0.0-dev.1"
required_textbook_ids = [
  "openstax_college_physics_2e",
  "openstax_physics",
  "openstax_college_physics_ap_2e",
]
output_dir = "artifacts/v2/textbooks/2.0.0-dev.1-real"
# The frozen chunk ruler: chunk sizes are counted with this tokenizer even when
# another embedding model is being compared, so a model swap never re-chunks.
chunk_config = { tokenizer_name = "Alibaba-NLP/gte-modernbert-base" }
# Where scripts/install_v2_sources.py puts the pinned PDFs.
sources_dir = "data/raw/v2"
embedding_model = "Alibaba-NLP/gte-modernbert-base"
embedding_max_seq_length = 8192
index_batch_size = 32

[concept_check]
enabled = false
allow_llm_generation = false
allow_unreviewed_questions = false
promotion_threshold = 0.75
demotion_threshold = 0.25
level_change_window = 3
attempt_coverage_window = 5
correct_difficulty_weights = [0.5, 1.0, 1.0]
wrong_difficulty_weights = [1.0, 1.0, 0.5]
min_topic_support = 0.5
