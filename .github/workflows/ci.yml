name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev,ml]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install as a real user would
        run: python -m pip install .
      - name: Grounded answer
        run: |
          cd "$(mktemp -d)"
          cs30-demo --question "What is acceleration?" --level beginner \
            | python -c "import json,sys; r=json.load(sys.stdin); assert r['mode']=='fixture'; assert r['answer']['citations']; assert set(r['answer']['citations']) <= {h['chunk_id'] for h in r['retrieval']['hits']}, 'citation not grounded in retrieval'"
      - name: Out-of-scope question must abstain, not fabricate
        run: |
          cd "$(mktemp -d)"
          cs30-demo --question "What is quantum entanglement?" --level advanced \
            | python -c "import json,sys; r=json.load(sys.stdin); assert r['answer']['abstained'] is True, 'pipeline answered without evidence'; assert r['retrieval']['hits']==[]; assert r['answer']['citations']==[]"

      # The two steps above run from a temp directory, to prove the installed
      # package works anywhere. The two below deliberately run from the
      # checkout, because they need tests/fixtures/index. That directory has no
      # index.faiss, so this exercises the BM25 path on a core-only install.
      - name: Real retrieval must abstain on an out-of-scope question
        env:
          CS30_RETRIEVAL_MODE: bm25
          CS30_INDEX_DIR: tests/fixtures/index
        run: |
          cs30-demo --mode real --provider mock \
            --question "What is quantum entanglement?" --level advanced \
            | python -c "import json,sys; r=json.load(sys.stdin); assert r['mode']=='real', f\"expected a real run, got {r['mode']!r}\"; assert r['retrieval']['hits']==[], 'real retrieval returned evidence for an out-of-scope question'; assert r['answer']['abstained'] is True, 'pipeline answered without evidence'; assert r['answer']['citations']==[]"
      - name: Real retrieval must still answer an in-scope question
        env:
          CS30_RETRIEVAL_MODE: bm25
          CS30_INDEX_DIR: tests/fixtures/index
        run: |
          cs30-demo --mode real --provider mock \
            --question "What is acceleration?" --level beginner \
            | python -c "import json,sys; r=json.load(sys.stdin); assert r['mode']=='real', f\"expected a real run, got {r['mode']!r}\"; assert r['retrieval']['hits'], 'real retrieval found nothing for an in-scope question'; assert r['answer']['abstained'] is False, 'pipeline abstained despite having evidence'; assert set(r['answer']['citations']) <= {h['chunk_id'] for h in r['retrieval']['hits']}, 'citation not grounded in retrieval'"
