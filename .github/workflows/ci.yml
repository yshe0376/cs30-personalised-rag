name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev,ml]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install as a real user would
        run: python -m pip install .
      - name: Grounded answer
        run: |
          cd "$(mktemp -d)"
          cs30-demo --question "What is acceleration?" --level beginner \
            | python -c "import json,sys; r=json.load(sys.stdin); assert r['mode']=='fixture'; assert r['answer']['citations']; assert set(r['answer']['citations']) <= {h['chunk_id'] for h in r['retrieval']['hits']}, 'citation not grounded in retrieval'"
      - name: Out-of-scope question must abstain, not fabricate
        run: |
          cd "$(mktemp -d)"
          cs30-demo --question "What is quantum entanglement?" --level advanced \
            | python -c "import json,sys; r=json.load(sys.stdin); assert r['answer']['abstained'] is True, 'pipeline answered without evidence'; assert r['retrieval']['hits']==[]; assert r['answer']['citations']==[]"
      - name: Real BM25 must abstain on an out-of-scope question
        env:
          CS30_FIXTURE_MODE: "false"
          CS30_INDEX_DIR: ${{ github.workspace }}/tests/fixtures/index
        run: |
          cd "$(mktemp -d)"
          cs30-demo --mode real --provider mock \
            --retrieval-mode bm25 \
            --question "What is quantum entanglement?" --level advanced \
            | python -c "import json,sys; r=json.load(sys.stdin); assert r['mode']=='real'; assert r['retrieval']['mode']=='bm25'; assert r['retrieval']['hits']==[]; assert r['answer']['abstained'] is True; assert r['answer']['citations']==[]"     
      - name: Real BM25 returns grounded in-domain evidence
        env:
          CS30_FIXTURE_MODE: "false"
          CS30_INDEX_DIR: ${{ github.workspace }}/tests/fixtures/index
        run: |
          cd "$(mktemp -d)"
          cs30-demo --mode real --provider mock \
            --retrieval-mode bm25 \
            --question "What is acceleration?" --level beginner \
            | python -c "import json,sys; r=json.load(sys.stdin); hits=r['retrieval']['hits']; citations=r['answer']['citations']; assert r['mode']=='real'; assert r['retrieval']['mode']=='bm25'; assert hits; assert r['answer']['abstained'] is False; assert citations; assert set(citations) <= {h['chunk_id'] for h in hits}"
